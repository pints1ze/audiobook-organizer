services:
  audiobook-organizer:
    build: .
    image: audiobook-organizer:latest
    ports:
      - "8080:8080"
    volumes:
      - ${DATA_DIR:-./docker/data}:/data
      - ${INCOMING_DIR:-./docker/incoming}:/incoming
      - ${LIBRARY_DIR:-./docker/library}:/library
    restart: unless-stopped
